{%- assign words = include.post.content | strip_html | number_of_words -%}
{%- assign minutes = words | divided_by: 200 | plus: 1 -%}
<p class="meta">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: site.date_format }}</time>
  <span aria-hidden="true">·</span> {{ minutes }} min read
  {%- for tag in include.post.tags %} <span class="tag">{{ tag }}</span>{% endfor %}
</p>
