title: "Luke Riley"
author: "Luke Riley"
description: "Business & FinTech · Georgia Institute of Technology"
permalink: /:title/
lang: "en"
date_format: "%B %-d, %Y"

# Top menu

navigation:
  - {file: "index.html", title: "Home"}
  - {file: "work.md", title: "Experience"}
  - {file: "projects.html", title: "Projects"}
  - {file: "articles.html", title: "Articles"}
  - {file: "skills.html", title: "Skills"}
  - {url: "/Resume_Riley_Luke.pdf", title: "CV"}

# Footer icons - icon names from fontawesome.com/icons (v5)

external:
  - {title: Mail, icon: envelope, url: "mailto:ljriley0310@gmail.com"}
  - {title: GitHub, icon: github, url: "https://github.com/lujoril"}
  - {title: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/lujoril"}
  - {title: RSS feed, icon: rss, url: "/feed.xml"}

# Every file in _posts/ is an article and uses the post layout
defaults:
  - scope: {path: "", type: "posts"}
    values: {layout: "post"}

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - UNLICENSE.txt

plugins:
  - jekyll-feed
