---
layout: default
---
<article class="post">
  <a class="back" href="{{ "/articles/" | relative_url }}">← All articles</a>
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% include meta.html post=page %}
  </header>
  {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="">{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
